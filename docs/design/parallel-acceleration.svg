<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" role="img" aria-labelledby="title desc">
  <title id="title">TurboCider GPU and ANE parallel execution by model and machine</title>
  <desc id="desc">A comparison of the fork and join execution lanes used by FLUX, Z-Image, H3, LTX, and FastMetal on Apple Silicon.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, sans-serif; fill: #0f172a; }
      .subtitle { font: 15px -apple-system, BlinkMacSystemFont, sans-serif; fill: #475569; }
      .head { font: 700 16px -apple-system, BlinkMacSystemFont, sans-serif; fill: #0f172a; }
      .label { font: 600 14px -apple-system, BlinkMacSystemFont, sans-serif; fill: #0f172a; }
      .small { font: 13px -apple-system, BlinkMacSystemFont, sans-serif; fill: #334155; }
      .tiny { font: 12px -apple-system, BlinkMacSystemFont, sans-serif; fill: #475569; }
      .lane { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 4 5; }
      .flow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .gpu { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; }
      .ane { fill: #f3e8ff; stroke: #9333ea; stroke-width: 1.5; }
      .join { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
      .media { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
      .muted { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; }
    </style>
  </defs>
  <rect width="1600" height="1260" fill="#ffffff"/>
  <text x="52" y="54" class="title">TurboCider · GPU / ANE 并行化与机器策略</text>
  <text x="52" y="82" class="subtitle">实线表示已实现的依赖边界；紫色块是 Core ML/ANE 子图，蓝色块是 Metal GPU，绿色块是 join。</text>
  <rect x="52" y="110" width="1496" height="100" rx="12" class="muted"/>
  <text x="78" y="141" class="head">设备准入</text>
  <text x="78" y="169" class="small">M4 Max 64 GB：FLUX 4B a6144、Z-Image base a4096 可自动选择（同 workload warm e2e ≥ 1.2×）。</text>
  <text x="78" y="191" class="small">M4 Pro 48 GB：FLUX 4B full-MLP profile；其他机器、LoRA-bound 未重复验证或缺 manifest：GPU fallback / explicit only。</text>

  <text x="52" y="252" class="head">按模型展开的 block / stage 级 fork → join</text>
  <text x="52" y="314" class="label">FLUX 4B · M4 Max</text><text x="52" y="337" class="tiny">自动 · 1.392× warm median</text>
  <rect x="292" y="292" width="138" height="42" rx="7" class="muted"/><text x="309" y="318" class="small">block input</text><line x1="430" y1="313" x2="475" y2="313" class="flow"/>
  <rect x="478" y="282" width="192" height="62" rx="7" class="gpu"/><text x="497" y="307" class="small">GPU attention</text><text x="497" y="327" class="tiny">+ MLP suffix [6144,9216)</text>
  <rect x="478" y="352" width="192" height="62" rx="7" class="ane"/><text x="497" y="377" class="small">ANE MLP prefix</text><text x="497" y="397" class="tiny">[0,6144) · INT8</text>
  <line x1="670" y1="313" x2="760" y2="364" class="flow"/><line x1="670" y1="383" x2="760" y2="364" class="flow"/><circle cx="780" cy="364" r="22" class="join"/><text x="767" y="369" class="small">join</text><line x1="802" y1="364" x2="850" y2="364" class="flow"/><rect x="854" y="343" width="172" height="42" rx="7" class="muted"/><text x="875" y="369" class="small">residual → next block</text>
  <text x="1060" y="357" class="tiny">80 Core ML calls / request</text><text x="1060" y="377" class="tiny">GPU 2.266 s vs direct 2.264 s</text>

  <text x="52" y="470" class="label">Z-Image Turbo · M4 Max</text><text x="52" y="493" class="tiny">自动 base · 1.212× warm median</text>
  <rect x="292" y="448" width="138" height="42" rx="7" class="muted"/><text x="309" y="474" class="small">S3-DiT block</text><line x1="430" y1="469" x2="475" y2="469" class="flow"/>
  <rect x="478" y="438" width="192" height="62" rx="7" class="gpu"/><text x="497" y="463" class="small">GPU attention</text><text x="497" y="483" class="tiny">+ FFN suffix [4096,10240)</text>
  <rect x="478" y="508" width="192" height="62" rx="7" class="ane"/><text x="497" y="533" class="small">ANE gated FFN</text><text x="497" y="553" class="tiny">[0,4096) · 32 blocks</text>
  <line x1="670" y1="469" x2="760" y2="520" class="flow"/><line x1="670" y1="539" x2="760" y2="520" class="flow"/><circle cx="780" cy="520" r="22" class="join"/><text x="767" y="525" class="small">join</text><line x1="802" y1="520" x2="850" y2="520" class="flow"/><rect x="854" y="499" width="172" height="42" rx="7" class="muted"/><text x="875" y="525" class="small">Euler FP32 update</text>
  <text x="1060" y="513" class="tiny">288 Core ML calls / request</text><text x="1060" y="533" class="tiny">0 output copies · LoRA explicit</text>

  <text x="52" y="626" class="label">H3 Turbo · manifest-gated</text><text x="52" y="649" class="tiny">GPU default · ANE candidate</text>
  <rect x="292" y="604" width="138" height="42" rx="7" class="muted"/><text x="309" y="630" class="small">denoise block</text><line x1="430" y1="625" x2="475" y2="625" class="flow"/>
  <rect x="478" y="594" width="192" height="62" rx="7" class="gpu"/><text x="497" y="619" class="small">GPU Metal/MPS</text><text x="497" y="639" class="tiny">residual + unsupported ops</text>
  <rect x="478" y="664" width="192" height="62" rx="7" class="ane"/><text x="497" y="689" class="small">Core ML / ANE</text><text x="497" y="709" class="tiny">MLP / optional QKV</text>
  <line x1="670" y1="625" x2="760" y2="676" class="flow"/><line x1="670" y1="695" x2="760" y2="676" class="flow"/><circle cx="780" cy="676" r="22" class="join"/><text x="767" y="681" class="small">join</text><line x1="802" y1="676" x2="850" y2="676" class="flow"/><rect x="854" y="655" width="172" height="42" rx="7" class="media"/><text x="875" y="681" class="small">video + audio decode</text>
  <text x="1060" y="669" class="tiny">LoRA identity / manifest strict</text><text x="1060" y="689" class="tiny">ANE median pending</text>

  <text x="52" y="782" class="label">LTX 2.5 · two-stage AV</text><text x="52" y="805" class="tiny">显式 candidate · not automatic</text>
  <rect x="292" y="760" width="138" height="42" rx="7" class="muted"/><text x="309" y="786" class="small">Stage 1 / 2 input</text><line x1="430" y1="781" x2="475" y2="781" class="flow"/>
  <rect x="478" y="750" width="192" height="62" rx="7" class="gpu"/><text x="497" y="775" class="small">GPU attention + AV</text><text x="497" y="795" class="tiny">dual queue / connector</text>
  <rect x="478" y="820" width="192" height="62" rx="7" class="ane"/><text x="497" y="845" class="small">ANE MLP / KV / QKV</text><text x="497" y="865" class="tiny">preload + detach + release</text>
  <line x1="670" y1="781" x2="760" y2="832" class="flow"/><line x1="670" y1="851" x2="760" y2="832" class="flow"/><circle cx="780" cy="832" r="22" class="join"/><text x="767" y="837" class="small">join</text><line x1="802" y1="832" x2="850" y2="832" class="flow"/><rect x="854" y="811" width="172" height="42" rx="7" class="media"/><text x="875" y="837" class="small">clean VAE + mux</text>
  <text x="1060" y="825" class="tiny">conditioning cache isolates setup</text><text x="1060" y="845" class="tiny">full e2e gate pending</text>

  <text x="52" y="938" class="label">FastMetal 1.3B · fixed shape</text><text x="52" y="961" class="tiny">external worker · validated base route</text>
  <rect x="292" y="916" width="138" height="42" rx="7" class="muted"/><text x="309" y="942" class="small">INT8 FFN block</text><line x1="430" y1="937" x2="475" y2="937" class="flow"/>
  <rect x="478" y="906" width="192" height="62" rx="7" class="gpu"/><text x="497" y="931" class="small">MLX GPU suffix</text><text x="497" y="951" class="tiny">4096/4864 complement</text>
  <rect x="478" y="976" width="192" height="62" rx="7" class="ane"/><text x="497" y="1001" class="small">ANE INT8 prefix</text><text x="497" y="1021" class="tiny">fixed 4096 channels</text>
  <line x1="670" y1="937" x2="760" y2="988" class="flow"/><line x1="670" y1="1007" x2="760" y2="988" class="flow"/><circle cx="780" cy="988" r="22" class="join"/><text x="767" y="993" class="small">join</text><line x1="802" y1="988" x2="850" y2="988" class="flow"/><rect x="854" y="967" width="172" height="42" rx="7" class="media"/><text x="875" y="993" class="small">TAEHV decode</text>
  <text x="1060" y="981" class="tiny">base latent / MP4 parity verified</text><text x="1060" y="1001" class="tiny">LoRA: premerged + GPU-only</text>

  <rect x="52" y="1090" width="1496" height="118" rx="12" class="muted"/><text x="78" y="1121" class="head">统一安全边界</text>
  <rect x="78" y="1141" width="16" height="16" class="gpu"/><text x="103" y="1154" class="small">Metal GPU</text><rect x="244" y="1141" width="16" height="16" class="ane"/><text x="269" y="1154" class="small">Core ML / ANE</text><rect x="444" y="1141" width="16" height="16" class="join"/><text x="469" y="1154" class="small">依赖 join</text><rect x="604" y="1141" width="16" height="16" class="media"/><text x="629" y="1154" class="small">媒体 / VAE</text>
  <text x="78" y="1185" class="small">缺 artifact、shape、LoRA identity、内存预算或质量/速度门禁时：自动模式回退 GPU；显式 gpu_ane 直接失败，不静默改变模型。</text>
</svg>
