<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1010" viewBox="0 0 1440 1010"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#475569"/></marker></defs><rect width="1440" height="1010" fill="white"/><text x="35" y="42" fill="#1e293b" font-family="Arial,sans-serif" font-size="29">Transformer heterogeneity: legal partitions and synchronization</text><text x="35" y="76" fill="#334155" font-family="Arial,sans-serif" font-size="19">Batch 1 • causal attention • independent weights per block • FP16 activations</text><text x="35" y="122" fill="#334155" font-family="Arial,sans-serif" font-size="23">A. Sequential pre-norm block: the FFN depends on the attention residual</text><rect x="35" y="147" width="160" height="70" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><text x="49" y="176" fill="#334155" font-family="Arial,sans-serif" font-size="18">X [S,H]</text><text x="49" y="201" fill="#334155" font-family="Arial,sans-serif" font-size="18">GPU RMSNorm</text><path d="M195 182 L230 182" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="230" y="147" width="255" height="70" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><text x="244" y="176" fill="#334155" font-family="Arial,sans-serif" font-size="18">GPU QKV → attention</text><text x="244" y="201" fill="#334155" font-family="Arial,sans-serif" font-size="18">output projection</text><path d="M485 182 L520 182" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="520" y="147" width="230" height="70" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><text x="534" y="176" fill="#334155" font-family="Arial,sans-serif" font-size="18">Add residual</text><text x="534" y="201" fill="#334155" font-family="Arial,sans-serif" font-size="18">GPU RMSNorm</text><path d="M750 182 L785 182" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="785" y="147" width="245" height="70" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/><text x="799" y="176" fill="#334155" font-family="Arial,sans-serif" font-size="18">Parallel FFN shards</text><text x="799" y="201" fill="#334155" font-family="Arial,sans-serif" font-size="18">details below</text><path d="M1030 182 L1065 182" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="1065" y="147" width="335" height="70" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><text x="1079" y="176" fill="#334155" font-family="Arial,sans-serif" font-size="18">GPU join + residual → Y</text><text x="1079" y="201" fill="#334155" font-family="Arial,sans-serif" font-size="18">Y feeds the next independent block</text><text x="35" y="268" fill="#334155" font-family="Arial,sans-serif" font-size="23">B. Tensor parallel FFN: split paired intermediate channels, reduce hidden-size partials</text><rect x="35" y="330" width="190" height="80" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="49" y="359" fill="#334155" font-family="Arial,sans-serif" font-size="18">Normalized X</text><text x="49" y="384" fill="#334155" font-family="Arial,sans-serif" font-size="18">[S,H]</text><rect x="330" y="290" width="360" height="80" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><text x="344" y="319" fill="#334155" font-family="Arial,sans-serif" font-size="18">GPU: up/gate prefix</text><text x="344" y="344" fill="#334155" font-family="Arial,sans-serif" font-size="18">SwiGLU → down prefix</text><path d="M225 370 L330 330" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M690 330 L865 370" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="402" width="360" height="80" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/><text x="344" y="431" fill="#334155" font-family="Arial,sans-serif" font-size="18">ANE: up/gate suffix</text><text x="344" y="456" fill="#334155" font-family="Arial,sans-serif" font-size="18">SwiGLU → down suffix</text><path d="M225 370 L330 442" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M690 442 L865 370" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="865" y="330" width="430" height="80" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><text x="879" y="359" fill="#334155" font-family="Arial,sans-serif" font-size="18">GPU: P_gpu + P_ane + residual</text><text x="879" y="384" fill="#334155" font-family="Arial,sans-serif" font-size="18">Each partial is [S,H]; one join</text><text x="330" y="521" fill="#6b21a8" font-family="Arial,sans-serif" font-size="17">CPU in the three-device ablation computes a small up/gate shard;</text><text x="330" y="546" fill="#6b21a8" font-family="Arial,sans-serif" font-size="17">its activation and down projection are consumed on GPU.</text><text x="35" y="593" fill="#334155" font-family="Arial,sans-serif" font-size="23">C. Sequence-row FFN: each branch has full weights, disjoint token rows</text><rect x="35" y="625" width="240" height="78" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><text x="49" y="654" fill="#334155" font-family="Arial,sans-serif" font-size="18">GPU: X[0:r,:]</text><text x="49" y="679" fill="#334155" font-family="Arial,sans-serif" font-size="18">complete FFN prefix</text><rect x="375" y="625" width="280" height="78" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/><text x="389" y="654" fill="#334155" font-family="Arial,sans-serif" font-size="18">ANE: X[r:S,:]</text><text x="389" y="679" fill="#334155" font-family="Arial,sans-serif" font-size="18">complete FFN suffix</text><path d="M275 664 L300 728" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 728 L760 728" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M655 664 L760 716" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="775" y="674" width="575" height="76" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><text x="789" y="703" fill="#334155" font-family="Arial,sans-serif" font-size="18">GPU: row-wise assembly + residual</text><text x="789" y="728" fill="#334155" font-family="Arial,sans-serif" font-size="18">Attention still uses all causal keys; no local-only attention</text><text x="35" y="798" fill="#334155" font-family="Arial,sans-serif" font-size="23">D. Head parallel attention: each assigned head sees the complete causal sequence</text><rect x="35" y="825" width="245" height="78" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><text x="49" y="854" fill="#334155" font-family="Arial,sans-serif" font-size="18">GPU QKV, all heads</text><text x="49" y="879" fill="#334155" font-family="Arial,sans-serif" font-size="18">shared Q/K/V [S,3H]</text><path d="M280 864 L330 864" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="825" width="350" height="78" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><text x="344" y="854" fill="#334155" font-family="Arial,sans-serif" font-size="18">GPU prefix heads: QK →</text><text x="344" y="879" fill="#334155" font-family="Arial,sans-serif" font-size="18">causal softmax → PV</text><rect x="750" y="825" width="380" height="78" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/><text x="764" y="854" fill="#334155" font-family="Arial,sans-serif" font-size="18">ANE or CPU suffix heads:</text><text x="764" y="879" fill="#334155" font-family="Arial,sans-serif" font-size="18">QK → causal softmax → PV</text><path d="M280 864 L305 941" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M305 941 L940 941" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M940 941 L940 903" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M680 864 L715 916" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M715 916 L1180 928" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M1130 864 L1180 928" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="1070" y="963" fill="#334155" font-family="Arial,sans-serif" font-size="20">Join → GPU W_o</text></svg>