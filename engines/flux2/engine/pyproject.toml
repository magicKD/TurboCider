[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flux2-mac-engine"
version = "0.1.0"
description = "A persistent MLX and MLX+ANE inference engine for FLUX.2 on Apple Silicon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
flux2-engine = "flux2_engine.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

