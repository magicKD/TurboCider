[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turbocider"
version = "0.1.0"
description = "Unified multimodal generation runtime for Apple Silicon"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
turbocider = "turbocider.cli:main"
turbociderd = "turbocider.cli:daemon_main"
turbocider-benchmark = "turbocider.benchmark:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
